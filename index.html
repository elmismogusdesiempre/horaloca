<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Hora Loca: una cámara, cuatro momentos y toda tu personalidad."
    />
    <title>Hora Loca — Tu momento</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="guest">
    <main class="camera-stage" aria-label="Photobooth">
      <video id="video" autoplay muted playsinline hidden></video>
      <canvas
        id="view"
        width="1600"
        height="900"
        aria-label="Cámara con efectos en toda la pantalla"
      ></canvas>
      <section id="welcome" class="welcome">
        <a
          class="brand"
          href="/organizador.html"
          aria-label="Hora Loca, ir al organizador"
          >hora<span>loca</span><i>✳</i></a
        >
        <h1>Tu gente.<br />Tu momento.</h1>
        <button id="camera-start" class="button lime">Activar cámara ↗</button>
        <p id="camera-message">
          Tus fotografías se quedan en este dispositivo.
        </p>
      </section>
      <p id="pose-prompt" class="pose-prompt" aria-live="polite"></p>
      <div id="countdown" class="countdown" aria-live="assertive"></div>
      <div id="flash" class="flash"></div>
      <button id="start" class="button lime guest-start" disabled hidden>
        ¡TÓCAME PARA EMPEZAR!
      </button>
      <p id="status" class="sr-only" role="status"></p>
    </main>
    <dialog id="result">
      <div class="result-head">
        <span class="eyebrow">ESTO MERECE GUARDARSE</span>
        <h2>Qué buena noche.</h2>
      </div>
      <img id="collage-preview" alt="Collage de tus cuatro fotografías" /><a
        id="download"
        class="button lime"
        download="horaloca.jpg"
        >Descargar recuerdo ↓</a
      ><button id="again" class="button ghost">Otra vez</button>
      <p id="return-message"></p>
    </dialog>
    <script type="module" src="/js/ui/guest.js"></script>
  </body>
</html>
